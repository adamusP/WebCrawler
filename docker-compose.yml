services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webcrawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webcrawler}
      POSTGRES_DB: ${POSTGRES_DB:-webcrawler}
    ports:
      - "5432:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-webcrawler} -d ${POSTGRES_DB:-webcrawler} ",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://webcrawler:webcrawler@postgres:5432/webcrawler?schema=public}
      PORT: ${BACKEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'wget -qO- http://localhost:3000/health | grep -q ''"status":"ok"''']
      interval: 5s
      timeout: 5s
      retries: 10

  crawler:
    build: ./crawler
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://webcrawler:webcrawler@postgres:5432/webcrawler?schema=public}
      PORT: ${CRAWLER_PORT:-3001}
      WORKER_COUNT: ${CRAWLER_WORKER_COUNT:-4}
      CONCURRENCY_PER_WORKER: ${CRAWLER_CONCURRENCY_PER_WORKER:-8}
    ports:
      - "${CRAWLER_PORT:-3001}:3001"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'wget -qO- http://localhost:3001/health | grep -q ''"status":"ok"''']
      interval: 5s
      timeout: 5s
      retries: 10

  graphql:
    build: ./graphql
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://webcrawler:webcrawler@postgres:5432/webcrawler?schema=public}
      PORT: ${GRAPHQL_PORT:-4000}
    ports:
      - "${GRAPHQL_PORT:-4000}:4000"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'wget -qO- http://localhost:4000/health | grep -q ''"status":"ok"''']
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-http://localhost:4000/graphql}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
      - graphql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres18-data:
